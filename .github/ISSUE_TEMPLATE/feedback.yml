name: Player feedback
description: Share your experience, suggest an improvement, or report a bug.
title: "[Feedback] "
body:
  - type: textarea
    id: feedback
    attributes:
      label: What would you like to share?
      description: Tell us what you enjoyed, what could improve, or what went wrong.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Mac model and macOS version
      placeholder: e.g. MacBook Air M2, macOS 15
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: For bugs, include the game mode, steps, and expected versus actual behavior. Avoid personal information in screenshots.
